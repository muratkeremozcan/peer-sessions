  #         lab_path=$(python3 -B evals/lab/lab.py start --hours 4)
  #         python3 -B evals/lab/lab.py ready "${lab_path%%/bin:*}" --needs 10800
  #         PATH="$lab_path" npm exec --prefix evals -- tea-evaluate ci --evaluation evals/peer-sessions --tier release
